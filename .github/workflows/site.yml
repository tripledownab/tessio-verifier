name: site

on:
  push:
    branches: [main]
    # Rebuild when the site sources, the contracts (DocFX scans them for XML docs),
    # the guides (DocFX pulls docs/going-live.md into the site) or this workflow change.
    paths:
      - 'site/**'
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/site.yml'
  # A finished release rebuilds main, because the landing page names the newest release tag. On the
  # release's completion rather than its tag push, so this rebuild waits until the package is pushed.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch at a time, queued rather than cancelled. Every run on main publishes the image's
# latest tag. Queued, the run a finished release starts cannot be stopped by an earlier push to main,
# and it cannot be overtaken by one either. Only the newest waiting run is kept. Per branch, so a
# dispatch on another branch cannot replace a waiting run on main. A failed release's run builds
# nothing, so it gets a group of its own rather than replacing a waiting run that would. Re-running
# an older run rebuilds its older commit and republishes that as latest.
concurrency:
  group: site-${{ github.ref }}${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && '-skipped' || '' }}
  cancel-in-progress: false

jobs:
  build:
    # A release that failed publishes nothing new, so there is nothing to rebuild for.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # packages: write for the site image below. Granted here rather than for the whole workflow, so the
    # deploy job does not get it.
    permissions:
      contents: read
      pages: write
      packages: write
    steps:
      # fetch-depth: 0 because the landing page reads the newest release from the v* tags. A
      # workflow_run event checks out main, the default branch. No persisted git credential, since the
      # builds below run third-party code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET (8 + 10 — global.json pins driver)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Install DocFX as global tool
        run: dotnet tool install -g docfx

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: site/web

      - name: Build DocFX (API reference → site/api-docs/_site)
        run: |
          docfx metadata site/api-docs/docfx.json
          docfx build site/api-docs/docfx.json

      - name: Build Astro (marketing landing → site/web/dist)
        run: npm run build
        working-directory: site/web

      - name: Merge DocFX output under /docs
        run: |
          rm -rf site/web/dist/docs
          cp -r site/api-docs/_site site/web/dist/docs

      - name: Inject Umami analytics into DocFX pages
        # DocFX modern has no partial hook for arbitrary <head> scripts (only
        # _googleAnalyticsTagId is built-in). Forking _master.tmpl would drift
        # on every DocFX upgrade; sed survives upgrades as long as </head>
        # exists. Mirrors site/preview.sh.
        run: |
          UMAMI_TAG='<script defer src="https://analytics.tessio.eu/script.js" data-website-id="a4075622-7115-4bb5-bc15-17b62a02408e"></script>'
          find site/web/dist/docs -name "*.html" -type f -exec \
            sed -i "s|</head>|${UMAMI_TAG}</head>|" {} +

      # Astro writes the sitemap during its own build, before the DocFX merge above, so it only ever
      # saw the landing page: the published sitemap listed one URL while the whole API reference and
      # the guides were missing from it. Runs after the merge, when the files actually exist.
      - name: Add the DocFX pages to the sitemap
        run: node scripts/add-docs-to-sitemap.mjs dist https://verifier.tessio.eu
        working-directory: site/web

      # The same output as an image that serves itself, for hosting it outside GitHub Pages. Pushed from
      # main only, never from another branch's dispatch. Besides latest, each run gets a tag of its own:
      # two runs on one commit can name different releases, so the commit alone does not pin content.
      - name: Publish the site image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/tripledownab/tessio-verifier-site
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" site
          docker push --all-tags "$IMAGE"

      - name: Configure Pages (auto-enable if not already)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # Ping IndexNow (Bing, Yandex, Seznam, Naver) once the new build is live. Google does not use
      # IndexNow; it is covered by Search Console and the sitemap in robots.txt.
      # This job does not otherwise check out the repo, so the script would not exist without this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # continue-on-error: a search-engine ping must never turn a good deploy into a failed one.
      - name: Tell IndexNow the docs changed
        continue-on-error: true
        env:
          INDEXNOW_KEY: 6859f82b21abec5c7b846a95f86d0d1a
          INDEXNOW_HOST: verifier.tessio.eu
        run: node site/web/scripts/submit-indexnow.mjs
