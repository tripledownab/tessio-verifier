name: site

on:
  push:
    branches: [main]
    # Rebuild when the site sources, the contracts (DocFX scans them for XML docs),
    # the guides (DocFX pulls docs/going-live.md into the site) or this workflow change.
    paths:
      - 'site/**'
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy pipeline at a time; a newer push supersedes a stale in-flight build
# (actions/deploy-pages switches atomically, so cancellation cannot half-deploy).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET (8 + 10 — global.json pins driver)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Install DocFX as global tool
        run: dotnet tool install -g docfx

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: site/web

      - name: Build DocFX (API reference → site/api-docs/_site)
        run: |
          docfx metadata site/api-docs/docfx.json
          docfx build site/api-docs/docfx.json

      - name: Build Astro (marketing landing → site/web/dist)
        run: npm run build
        working-directory: site/web

      - name: Merge DocFX output under /docs
        run: |
          rm -rf site/web/dist/docs
          cp -r site/api-docs/_site site/web/dist/docs

      - name: Inject Umami analytics into DocFX pages
        # DocFX modern has no partial hook for arbitrary <head> scripts (only
        # _googleAnalyticsTagId is built-in). Forking _master.tmpl would drift
        # on every DocFX upgrade; sed survives upgrades as long as </head>
        # exists. Mirrors site/preview.sh.
        run: |
          UMAMI_TAG='<script defer src="https://analytics.tessio.eu/script.js" data-website-id="a4075622-7115-4bb5-bc15-17b62a02408e"></script>'
          find site/web/dist/docs -name "*.html" -type f -exec \
            sed -i "s|</head>|${UMAMI_TAG}</head>|" {} +

      # Astro writes the sitemap during its own build, before the DocFX merge above, so it only ever
      # saw the landing page: the published sitemap listed one URL while the whole API reference and
      # the guides were missing from it. Runs after the merge, when the files actually exist.
      - name: Add the DocFX pages to the sitemap
        run: node scripts/add-docs-to-sitemap.mjs dist https://verifier.tessio.eu
        working-directory: site/web

      - name: Configure Pages (auto-enable if not already)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # Ping IndexNow (Bing, Yandex, Seznam, Naver) once the new build is live. Google does not use
      # IndexNow; it is covered by Search Console and the sitemap in robots.txt.
      # This job does not otherwise check out the repo, so the script would not exist without this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # continue-on-error: a search-engine ping must never turn a good deploy into a failed one.
      - name: Tell IndexNow the docs changed
        continue-on-error: true
        env:
          INDEXNOW_KEY: 6859f82b21abec5c7b846a95f86d0d1a
          INDEXNOW_HOST: verifier.tessio.eu
        run: node site/web/scripts/submit-indexnow.mjs
