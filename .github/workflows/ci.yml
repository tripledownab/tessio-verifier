name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
    # No tag trigger: release.yml builds and tests independently on tags.
    # Docs, site and repo-meta changes don't affect the build; skip CI for them.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  # Every pull request, whatever its base. A base filter here made a pull request stacked on another
  # branch run no checks at all, and "no checks reported" reads like "not run yet" rather than "never
  # will", so untested code could merge into the base and reach main inside one squashed commit.
  # Retargeting a pull request to another base does NOT rerun it: that is an `edited` event, and
  # listening for it would let a title edit cancel a running check through the concurrency group
  # below. After retargeting, push a commit or rerun the workflow.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  # Windows coverage matters (most consuming .NET shops run Windows; X.509 SAN formatting is
  # platform-dependent) but Windows minutes are billed at 2x and show up on the org meter, so the
  # Windows leg runs weekly and on demand instead of on every push.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

# Rapid consecutive pushes supersede each other; cancel the stale run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET (8 + 10 — global.json drives the SDK pin)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      # Locked mode: a restore whose resolution differs from the committed packages.lock.json fails
      # here, which catches a dependency change that did not regenerate the lock files. It guards
      # against accidents, not deliberate edits; see tools/check-conformance-record.py.
      - name: Restore
        run: dotnet restore Tessio.Verifier.sln --locked-mode

      - name: Build
        run: dotnet build Tessio.Verifier.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Tessio.Verifier.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      # The run above happens on a UTC machine, and some of what this library decides is a comparison
      # against a certificate's validity window. X509Certificate2 reports NotBefore and NotAfter in
      # LOCAL time, so code that compares them against a UTC clock is exactly right on a UTC machine
      # and wrong by the offset everywhere else. A suite that only ever runs at UTC cannot see that.
      #
      # Re-running the trust tests east of Greenwich is what turns the guarantee into something CI
      # enforces rather than something a comment claims. It is the trust project only, and reuses the
      # build above, so it costs seconds rather than a job.
      #
      # TZ is read by .NET on Linux and macOS. On the Windows matrix entry it is ignored, so this step
      # re-runs the tests at that runner's own zone and adds nothing there. Harmless, and worth saying
      # rather than leaving a reader to assume the coverage is on every platform.
      - name: Test the trust decisions again, away from UTC
        env:
          TZ: Pacific/Kiritimati
        run: dotnet test tests/Tessio.Verifier.Trust.Tests --no-build --configuration Release

      - name: Pack
        run: dotnet pack Tessio.Verifier.sln --no-build --configuration Release --output ./artifacts

      - name: Upload packages
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkgs
          path: artifacts/*.nupkg
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7
