name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for this tag
      id-token: write # OIDC token issuance for NuGet Trusted Publishing, and provenance signing
      attestations: write # store the build provenance attestation
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET (8 + 10)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Tessio.Verifier.sln

      - name: Build
        run: dotnet build Tessio.Verifier.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Tessio.Verifier.sln --no-build --configuration Release

      - name: Pack
        run: dotnet pack Tessio.Verifier.sln --no-build --configuration Release --output ./release-artifacts

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-nupkgs
          path: release-artifacts/*.*nupkg

      # SLSA-style build provenance: a signed statement that these exact nupkgs were built by this
      # workflow from this commit. Verifiable by anyone with `gh attestation verify <pkg> -R <repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-artifacts/*.nupkg'

      # Preferred path: Trusted Publishing (OIDC -> 1-hour API key, no long-lived secret).
      # Requires a nuget.org trusted publishing policy for this repo + workflow, and the
      # NUGET_USER secret set to the nuget.org profile that owns the policy.
      - name: NuGet login (OIDC → temp API key)
        if: env.NUGET_USER != ''
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet (trusted publishing)
        if: env.NUGET_USER != ''
        run: >
          dotnet nuget push "release-artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Fallback path: classic long-lived API key, used only when no NUGET_USER is configured.
      - name: Push to NuGet (API key fallback)
        if: env.NUGET_USER == '' && env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "release-artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: NuGet publish skipped
        if: env.NUGET_USER == '' && env.NUGET_API_KEY == ''
        run: echo "::warning::Neither NUGET_USER (trusted publishing) nor NUGET_API_KEY is configured; packages were built but not published."

      # Without this the tag ships to nuget.org and the repo's Releases page silently stays behind.
      # That happened for v0.3.0 through v0.3.3: all four were on NuGet while the repo still showed
      # v0.2.1 as latest, which reads as an abandoned project to anyone evaluating the library.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag containing a hyphen is a prerelease by SemVer (v0.3.0-preview.1), and marking it keeps
          # it off the repo's "Latest" badge. --generate-notes derives the changelog from the previous
          # release, so no git history is needed beyond the shallow checkout.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            release-artifacts/*.nupkg
