version: 2
updates:
  # NuGet dependencies. Microsoft.IdentityModel patches matter for a verifier; check often.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      identitymodel:
        patterns:
          - "Microsoft.IdentityModel.*"

  # Actions are pinned by commit SHA, so every bump is a SHA swap and there is nothing to review in one
  # that is not in all of them. Ungrouped, each action becomes its own pull request and its own CI run:
  # on 2026-09-11 three of the five open here were a codeql-action init bump, the matching analyze bump
  # and a deploy-pages bump, which is one change wearing three hats. Grouped, that is one pull request
  # a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Marketing site (Astro).
  - package-ecosystem: npm
    directory: /site/web
    schedule:
      interval: monthly
