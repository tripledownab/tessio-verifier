version: 2
updates:
  # NuGet dependencies. Microsoft.IdentityModel patches matter for a verifier; check often.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      identitymodel:
        patterns:
          - "Microsoft.IdentityModel.*"

  # Actions are pinned by commit SHA, so every bump is a SHA swap and there is nothing to review in one
  # that is not in all of them. Ungrouped, each action becomes its own pull request and its own CI run:
  # on 2026-09-11 three of the five open here were a codeql-action init bump, the matching analyze bump
  # and a deploy-pages bump, which is one change wearing three hats. Grouped, that is one pull request
  # a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        # MAJORS STAY OUT. A group with no update-types folds a major bump in with the patches, and a
        # major is the one action update that can change a workflow's inputs or outputs and break CI.
        # Bundled, the safe half cannot be merged without the risky half. Left ungrouped, a major
        # arrives alone and gets the reading it needs.
        update-types:
          - minor
          - patch

  # Marketing site (Astro).
  - package-ecosystem: npm
    directory: /site/web
    schedule:
      interval: monthly
