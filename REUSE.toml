# REUSE 3.3 licensing declaration (reuse.software). One license for the whole repo, declared
# centrally instead of as a header comment in every file.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) Triple Down AB"
SPDX-License-Identifier = "Apache-2.0"

# Longfellow circuits, generated by Longfellow's circuit maker and published in github.com/longfellow-zk/longfellow-zk
# under lib/circuits/mdoc/circuits at the commit src/Tessio.Verifier.Core.Mdoc.Zk/native/Dockerfile pins. Each file
# is checked against the circuit hash in its name before use. The year is the one each circuit was first published in.
[[annotations]]
path = "src/Tessio.Verifier.Core.Mdoc.Zk/Circuits/longfellow-libzk-v1_6_*"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2025 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "src/Tessio.Verifier.Core.Mdoc.Zk/Circuits/longfellow-libzk-v1_7_*"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2026 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

